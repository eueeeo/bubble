<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мессенджер</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-slate-100 font-sans h-screen flex flex-col text-slate-800 overflow-hidden">

  <header class="bg-white border-b border-slate-200 px-4 py-2.5 shadow-sm shrink-0 flex items-center justify-between">
    <a href="./index.html" class="text-xs font-semibold text-purple-600 hover:underline">← Назад к разделу</a>
  </header>

  <main class="flex-1 flex max-w-5xl w-full mx-auto my-0 sm:my-4 sm:rounded-2xl border border-slate-200 bg-white shadow overflow-hidden">
    
    <aside class="w-72 border-r border-slate-200 flex flex-col shrink-0 bg-slate-50">
      <div class="p-3 border-b border-slate-200 bg-white">
        <h2 class="text-sm font-bold text-slate-900">Чаты</h2>
      </div>

      <div class="flex-1 overflow-y-auto divide-y divide-slate-100 [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:bg-slate-300">
        
        <div class="p-3 bg-blue-50/60 flex items-center gap-3 cursor-pointer">
          <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=100&q=80" alt="Алиса" class="w-10 h-10 rounded-full object-cover">
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-baseline">
              <h3 class="text-xs font-bold text-slate-900 truncate">Алиса</h3>
              <span class="text-[10px] text-slate-400">12:30</span>
            </div>
            <p class="text-xs text-slate-500 truncate">Макет согласован, проверяй!</p>
          </div>
          <span class="w-4 h-4 rounded-full bg-blue-600 text-white text-[10px] font-bold flex items-center justify-center">1</span>
        </div>

        <div class="p-3 hover:bg-slate-100 flex items-center gap-3 cursor-pointer transition-colors">
          <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=100&q=80" alt="Иван" class="w-10 h-10 rounded-full object-cover">
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-baseline">
              <h3 class="text-xs font-bold text-slate-900 truncate">Иван</h3>
              <span class="text-[10px] text-slate-400">10:15</span>
            </div>
            <p class="text-xs text-slate-500 truncate">Привет, когда созвон?</p>
          </div>
        </div>

      </div>
    </aside>

    <section class="flex-1 flex flex-col min-w-0 bg-white">
      
      <div class="h-14 px-4 border-b border-slate-200 flex items-center gap-3 shrink-0">
        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=100&q=80" alt="Алиса" class="w-8 h-8 rounded-full object-cover">
        <div>
          <h2 class="text-xs font-bold text-slate-900">Алиса</h2>
          <span class="text-[10px] text-emerald-600 font-medium">в сети</span>
        </div>
      </div>

      <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-3 [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:bg-slate-300">
        
        <div class="flex items-end gap-2 max-w-sm">
          <div class="bg-slate-200 text-slate-800 text-xs p-3 rounded-xl rounded-bl-none">
            Привет! Ты успел закончить правки?
          </div>
        </div>

        <div class="flex items-end justify-end gap-2 ml-auto max-w-sm">
          <div class="bg-blue-600 text-white text-xs p-3 rounded-xl rounded-br-none">
            Привет! Да, чат готов, сообщения отправляются штатно.
          </div>
        </div>

        <div class="flex items-end gap-2 max-w-sm">
          <div class="bg-slate-200 text-slate-800 text-xs p-3 rounded-xl rounded-bl-none">
            Отлично, макет согласован, проверяй!
          </div>
        </div>

      </div>

      <div class="sticky bottom-0 bg-white border-t border-slate-200 p-3 shrink-0">
        <form class="flex gap-2" onsubmit="sendMessage(event)">
          <input 
            type="text" 
            id="msg-input" 
            required 
            placeholder="Напишите сообщение..." 
            class="flex-1 bg-slate-100 text-xs px-3 py-2 rounded-lg border border-transparent focus:bg-white focus:border-blue-500 focus:outline-none transition-colors"
          >
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2 rounded-lg transition-colors">
            Отправить
          </button>
        </form>
      </div>

    </section>

  </main>

  <script>
    function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;

      const container = document.getElementById('messages');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'flex items-end justify-end gap-2 ml-auto max-w-sm';
      msgDiv.innerHTML = `<div class="bg-blue-600 text-white text-xs p-3 rounded-xl rounded-br-none">${text}</div>`;
      container.appendChild(msgDiv);
      input.value = '';
      container.scrollTop = container.scrollHeight;
    }
  </script>

</body>
</html>

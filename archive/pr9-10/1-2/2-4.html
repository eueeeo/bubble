<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация в прачечной Bubble</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans flex flex-col justify-between">

  <header class="bg-white border-b border-slate-200 px-4 py-3 shadow-sm">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <a href="./index.html" class="text-xs font-semibold text-bubble-blue hover:underline">← Назад к разделу</a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl border border-slate-200 shadow p-6">
      
      <h1 class="text-xl font-bold text-slate-900 mb-1">Регистрация в Bubble</h1>
      <p class="text-xs text-slate-500 mb-4">Создайте аккаунт для отслеживания стирки и накопления бонусов</p>

      <form id="reg-form" class="space-y-4" onsubmit="handleSubmit(event)">
        
        <div>
          <label for="email" class="block text-xs font-semibold text-slate-700 mb-1">Email</label>
          <input 
            type="email" 
            id="email" 
            required 
            placeholder="name@example.com"
            class="peer w-full px-3 py-2 rounded-lg border border-slate-300 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-bubble-blue peer-invalid:border-red-500 transition-colors"
          >
          <span class="hidden peer-invalid:block text-[11px] text-red-500 mt-1">
            Введите корректный адрес электронной почты
          </span>
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold text-slate-700 mb-1">Пароль</label>
          <input 
            type="password" 
            id="password" 
            required 
            minlength="6"
            placeholder="Минимум 6 символов"
            oninput="checkPassword(this.value)"
            class="peer w-full px-3 py-2 rounded-lg border border-slate-300 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-bubble-blue peer-focus:ring-2 peer-invalid:border-red-500 transition-colors"
          >
          
          <div class="grid grid-cols-3 gap-1.5 mt-2 h-1 bg-slate-100 rounded-full overflow-hidden">
            <div id="bar-1" class="h-full bg-slate-200"></div>
            <div id="bar-2" class="h-full bg-slate-200"></div>
            <div id="bar-3" class="h-full bg-slate-200"></div>
          </div>
        </div>

        <div>
          <label for="confirm" class="block text-xs font-semibold text-slate-700 mb-1">Подтверждение пароля</label>
          <input 
            type="password" 
            id="confirm" 
            required 
            placeholder="Повторите пароль"
            class="w-full px-3 py-2 rounded-lg border border-slate-300 text-xs text-slate-900 focus:outline-none focus:ring-2 focus:ring-bubble-blue transition-colors"
          >
        </div>

        <div class="flex items-center gap-2">
          <input type="checkbox" id="agree" required class="h-4 w-4 rounded border-slate-300 text-bubble-blue focus:ring-2 focus:ring-bubble-blue">
          <label for="agree" class="text-xs text-slate-600">Я согласен с условиями обслуживания прачечной</label>
        </div>

        <button 
          type="submit" 
          id="submit-btn"
          class="group w-full bg-bubble-blue hover:bg-blue-600 text-white font-semibold text-xs py-2.5 rounded-lg shadow disabled:opacity-50 transition-colors flex items-center justify-center gap-2"
        >
          <span class="group-[.is-loading]:hidden">Зарегистрироваться</span>
          <span class="hidden group-[.is-loading]:inline-flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5 animate-spin" viewBox="0 0 24 24" fill="none">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
            Отправка...
          </span>
        </button>

      </form>
    </div>
  </main>

  <script>
    function checkPassword(val) {
      const b1 = document.getElementById('bar-1');
      const b2 = document.getElementById('bar-2');
      const b3 = document.getElementById('bar-3');

      b1.className = 'h-full bg-slate-200';
      b2.className = 'h-full bg-slate-200';
      b3.className = 'h-full bg-slate-200';

      if (val.length >= 6) {
        b1.className = 'h-full bg-red-500';
      }
      if (val.length >= 8 && /[0-9]/.test(val)) {
        b1.className = 'h-full bg-amber-500';
        b2.className = 'h-full bg-amber-500';
      }
      if (val.length >= 10 && /[A-ZА-Я]/.test(val) && /[0-9]/.test(val)) {
        b1.className = 'h-full bg-emerald-500';
        b2.className = 'h-full bg-emerald-500';
        b3.className = 'h-full bg-emerald-500';
      }
    }

    function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.classList.add('is-loading');
      btn.disabled = true;

      setTimeout(() => {
        btn.classList.remove('is-loading');
        btn.disabled = false;
        alert('Регистрация успешно пройдена!');
        e.target.reset();
        checkPassword('');
      }, 1500);
    }
  </script>

</body>
</html>

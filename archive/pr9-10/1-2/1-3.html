<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог услуг прачечной Bubble</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans flex flex-col justify-between">

  <header class="bg-white border-b border-slate-200 px-4 py-3 shadow-sm">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <a href="./index.html" class="text-xs font-semibold text-bubble-blue hover:underline">← Назад к разделу</a>
    </div>
  </header>

  <main class="flex-1 max-w-6xl mx-auto w-full p-4 sm:p-6">
    <h1 class="text-xl font-bold text-slate-900 mb-4">Услуги прачечной Bubble</h1>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">

      <article class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm hover:scale-105 transition duration-300 flex flex-col justify-between">
        <div>
          <img src="../images/1.webp" alt="Стирка повседневных вещей" class="aspect-square w-full rounded-xl object-cover mb-3 bg-slate-100">
          <h2 class="text-sm font-bold text-slate-900">Стирка (до 7 кг)</h2>
        </div>
        <div class="mt-4 flex items-center justify-between pt-2 border-t border-slate-100">
          <span class="text-sm font-extrabold text-slate-900">8 BYN <span class="text-xs font-normal text-slate-400">/ загрузка</span></span>
          <button type="button" class="bg-bubble-blue hover:bg-blue-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition-colors">
            В корзину
          </button>
        </div>
      </article>

      <article class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm hover:scale-105 transition duration-300 flex flex-col justify-between">
        <div>
          <img src="../images/2.jpg" alt="Сушка вещей" class="aspect-square w-full rounded-xl object-cover mb-3 bg-slate-100">
          <h2 class="text-sm font-bold text-slate-900">Сушка белья</h2>
        </div>
        <div class="mt-4 flex items-center justify-between pt-2 border-t border-slate-100">
          <span class="text-sm font-extrabold text-slate-900">5 BYN <span class="text-xs font-normal text-slate-400">/ цикл</span></span>
          <button type="button" class="bg-bubble-blue hover:bg-blue-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition-colors">
            В корзину
          </button>
        </div>
      </article>

      <article class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm hover:scale-105 transition duration-300 flex flex-col justify-between">
        <div>
          <img src="../images/3.webp" alt="Глажка рубашек и одежды" class="aspect-square w-full rounded-xl object-cover mb-3 bg-slate-100">
          <h2 class="text-sm font-bold text-slate-900">Глажка и отпаривание</h2>
        </div>
        <div class="mt-4 flex items-center justify-between pt-2 border-t border-slate-100">
          <span class="text-sm font-extrabold text-slate-900">от 3 BYN <span class="text-xs font-normal text-slate-400">/ вещь</span></span>
          <button type="button" class="bg-bubble-blue hover:bg-blue-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition-colors">
            В корзину
          </button>
        </div>
      </article>

      <article class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm hover:scale-105 transition duration-300 flex flex-col justify-between">
        <div>
          <img src="../images/4.jpeg" alt="Химчистка верхней одежды" class="aspect-square w-full rounded-xl object-cover mb-3 bg-slate-100">
          <h2 class="text-sm font-bold text-slate-900">Химчистка пальто и курток</h2>
        </div>
        <div class="mt-4 flex items-center justify-between pt-2 border-t border-slate-100">
          <span class="text-sm font-extrabold text-slate-900">от 20 BYN <span class="text-xs font-normal text-slate-400">/ вещь</span></span>
          <button type="button" class="bg-bubble-blue hover:bg-blue-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition-colors">
            В корзину
          </button>
        </div>
      </article>

      <article class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm hover:scale-105 transition duration-300 flex flex-col justify-between">
        <div>
          <img src="../images/5.jpg" alt="Стирка и чистка обуви" class="aspect-square w-full rounded-xl object-cover mb-3 bg-slate-100">
          <h2 class="text-sm font-bold text-slate-900">Стирка обуви (кеды, кроссовки)</h2>
        </div>
        <div class="mt-4 flex items-center justify-between pt-2 border-t border-slate-100">
          <span class="text-sm font-extrabold text-slate-900">15 BYN <span class="text-xs font-normal text-slate-400">/ пара</span></span>
          <button type="button" class="bg-bubble-blue hover:bg-blue-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition-colors">
            В корзину
          </button>
        </div>
      </article>

      <article class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm hover:scale-105 transition duration-300 flex flex-col justify-between">
        <div>
          <img src="../images/6.webp" alt="Стирка пледов и одеял" class="aspect-square w-full rounded-xl object-cover mb-3 bg-slate-100">
          <h2 class="text-sm font-bold text-slate-900">Одеяла и пледы</h2>
        </div>
        <div class="mt-4 flex items-center justify-between pt-2 border-t border-slate-100">
          <span class="text-sm font-extrabold text-slate-900">18 BYN <span class="text-xs font-normal text-slate-400">/ шт.</span></span>
          <button type="button" class="bg-bubble-blue hover:bg-blue-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition-colors">
            В корзину
          </button>
        </div>
      </article>

    </div>
  </main>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero-секция прачечной Bubble</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen flex flex-col justify-between">

  <header class="relative z-20 border-b border-slate-800 bg-slate-900/60 backdrop-blur px-4 py-3">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <a href="./index.html" class="text-xs font-semibold text-bubble-blue-ice hover:underline">← Назад к разделу</a>
    </div>
  </header>

  <main class="relative flex-1 flex items-center justify-center overflow-hidden px-4 py-20">
    
    <div class="absolute inset-0 bg-cover bg-center" style="background-image: url('../images/1.webp');"></div>
    
    <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm"></div>

    <div class="absolute -top-10 -left-10 w-72 h-72 bg-bubble-blue/30 rounded-full blur-3xl animate-pulse"></div>
    <div class="absolute -bottom-10 -right-10 w-72 h-72 bg-bubble-pink/30 rounded-full blur-3xl animate-pulse"></div>

    <div class="relative z-10 max-w-3xl mx-auto text-center space-y-6">
      <span class="inline-block px-4 py-1.5 rounded-full border border-bubble-blue-ice/40 text-bubble-blue-ice text-xs font-bold uppercase tracking-wider">
        Bubble • Прачечная самообслуживания
      </span>

      <h1 class="text-4xl sm:text-6xl font-black tracking-tight">
        Стираем ради <br>
        <span class="bg-gradient-to-r from-bubble-blue-ice via-bubble-blue-light to-bubble-pink bg-clip-text text-transparent">
          ваших улыбок
        </span>
      </h1>

      <p class="text-sm sm:text-base text-slate-300 max-w-xl mx-auto leading-relaxed">
        Стирка, сушка, глажка и чистка в Минске. Профессиональное оборудование, бережный уход и кофе, пока стираются вещи.
      </p>

      <div class="flex flex-col sm:flex-row items-center justify-center gap-4 pt-2">
        <a href="#order" class="w-full sm:w-auto bg-bubble-blue hover:bg-blue-600 text-white font-semibold text-xs px-6 py-3 rounded-xl transition-colors shadow">
          Смотреть цены
        </a>
        <a href="#addresses" class="w-full sm:w-auto border border-white/60 hover:bg-white/10 text-white font-semibold text-xs px-6 py-3 rounded-xl transition-colors">
          Найти прачечную
        </a>
      </div>
    </div>

  </main>

</body>
</html>

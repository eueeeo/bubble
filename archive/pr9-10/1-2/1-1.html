<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карточка сотрудника прачечной</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans flex flex-col justify-between">

  <header class="bg-white border-b border-slate-200 px-4 py-3 shadow-sm">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <a href="./index.html" class="text-xs font-semibold text-bubble-blue hover:underline">← Назад к разделу</a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center p-4">
    <article class="w-full sm:w-80 bg-white rounded-2xl shadow p-6 flex flex-col items-center text-center space-y-4">
      <img 
        src="../images/profile.jpg" 
        alt="Аватар администратора" 
        class="w-20 h-20 rounded-full object-cover"
      >
      
      <div>
        <h2 class="text-lg font-bold text-slate-900">Анна Пузырькова</h2>
        <p class="text-xs font-semibold text-bubble-blue">Администратор прачечной Bubble</p>
      </div>

      <p class="text-xs text-slate-600 leading-relaxed">
        Консультации по бережной стирке, сушке и глажке. Прием заказов на Пузырьковой, 12.
      </p>

      <div class="w-full flex gap-3 pt-2">
        <button type="button" class="flex-1 bg-bubble-blue hover:bg-blue-600 text-white text-xs font-semibold py-2 px-4 rounded-xl shadow transition-colors">
          Позвонить
        </button>
        <button type="button" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold py-2 px-4 rounded-xl border border-slate-200 transition-colors">
          Написать
        </button>
      </div>
    </article>
  </main>

</body>
</html>
